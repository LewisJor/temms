[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "temms"
version = "0.2.0a1"
description = "Tiny runtime-independent adaptive model selection"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "TEMMS Contributors"}]
keywords = ["machine-learning", "inference", "edge", "runtime", "model-selection"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
onnx = [
  "numpy>=1.26",
  "onnx>=1.16",
  "onnxruntime>=1.16",
]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.9",
  "build>=1.2",
]

[project.urls]
Repository = "https://github.com/LewisJor/temms"
Issues = "https://github.com/LewisJor/temms/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
temms = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 8
