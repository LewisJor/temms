[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "temms"
version = "0.2.0a1"
description = "Tiny runtime-independent adaptive model selection"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "TEMMS Contributors"}]
keywords = ["machine-learning", "inference", "edge", "runtime", "model-selection"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
demo = ["Pillow>=10"]
onnx = [
  "numpy>=1.26",
  "onnxruntime>=1.16",
]
dev = [
  "mypy>=1.19.1",
  "onnx>=1.16",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.9",
  "build>=1.2",
]

[project.urls]
Repository = "https://github.com/LewisJor/temms"
Issues = "https://github.com/LewisJor/temms/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
temms = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

# Run with `python -m mypy`; the consumer fixture checks the published interfaces.
[tool.mypy]
python_version = "3.11"
files = ["src/temms", "tests/test_typing.py"]
strict = true

[[tool.mypy.overrides]]
module = ["onnxruntime"]
# This optional native dependency does not publish typing metadata.
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 8
