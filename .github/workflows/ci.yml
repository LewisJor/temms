name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,onnx,demo]"
      - run: python -m ruff check src tests examples
      - run: python -m mypy
      - run: python -m pytest -ra
      - run: python -m build
        if: matrix.python-version == '3.11'
      - name: Build with the minimum supported backend
        if: matrix.python-version == '3.11'
        run: |
          python -m pip install "setuptools==77.0.3" wheel
          python -m build --no-isolation --outdir /tmp/temms-minimum-dist
