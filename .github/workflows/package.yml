name: Installed core package

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  installed-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Build the wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir "$RUNNER_TEMP/temms-dist"
      - name: Install into a clean core-only environment
        run: |
          python -m venv "$RUNNER_TEMP/temms-core"
          "$RUNNER_TEMP/temms-core/bin/python" -m pip install --no-index --no-deps "$RUNNER_TEMP"/temms-dist/*.whl
      - name: Verify installed imports and dependency metadata
        run: |
          "$RUNNER_TEMP/temms-core/bin/python" -I - <<'PY'
          import importlib
          import importlib.metadata
          import importlib.util
          import sysconfig
          from pathlib import Path

          site_packages = Path(sysconfig.get_path("purelib")).resolve()
          for name in (
              "temms", "temms.engine", "temms.errors", "temms.runtime",
              "temms.selector", "temms.types", "temms.adapters",
              "temms.adapters.memory", "temms.adapters.onnx",
          ):
              module = importlib.import_module(name)
              assert Path(module.__file__).resolve().is_relative_to(site_packages), name
          for name in ("numpy", "onnx", "onnxruntime", "PIL"):
              assert importlib.util.find_spec(name) is None, name

          distribution = importlib.metadata.distribution("temms")
          metadata = distribution.metadata
          # Every dependency must belong solely to a declared optional extra.
          optional_markers = {
              f'extra == "{extra}"' for extra in metadata.get_all("Provides-Extra", [])
          }
          required = [
              requirement for requirement in metadata.get_all("Requires-Dist", [])
              if requirement.partition(";")[2].strip() not in optional_markers
          ]
          assert not required, required
          assert distribution.locate_file("temms/py.typed").is_file()
          print(f"Installed TEMMS {distribution.version}: core and adapters import without extras")
          PY
      - name: Run the maintained example against the installed wheel
        run: '"$RUNNER_TEMP/temms-core/bin/python" -I examples/adaptive_vision.py'
